<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 30" width="320" height="60">
  <defs>
    <!-- Диагональный градиент вдоль всей удлиненной линии -->
    <linearGradient id="longerSlimLineGradient" gradientUnits="userSpaceOnUse" x1="4" y1="11" x2="156" y2="19">
      <stop offset="0%" stop-color="#3686ff" />
      <stop offset="50%" stop-color="#ff658c" />
      <stop offset="100%" stop-color="#f2ff3d" />
    </linearGradient>
  </defs>
  
  <!-- Более тонкая удлиненная линия (толщина в центре ~3.5px) -->
  <path d="M 4,15 Q 80,11.5 156,15 Q 80,18.5 4,15 Z" fill="url(#longerSlimLineGradient)" />
</svg>
