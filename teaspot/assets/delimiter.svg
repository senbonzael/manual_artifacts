<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" width="200" height="80">
  <defs>
    <!-- Единый диагональный градиент (сверху слева вниз направо) -->
    <linearGradient id="diagonalGradient" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="92" y2="32">
      <stop offset="0%" stop-color="#3686ff" />
      <stop offset="50%" stop-color="#ff658c" />
      <stop offset="100%" stop-color="#f2ff3d" />
    </linearGradient>
  </defs>
  
  <!-- Три точки -->
  <circle cx="20" cy="20" r="12" fill="url(#diagonalGradient)" />
  <circle cx="50" cy="20" r="12" fill="url(#diagonalGradient)" />
  <circle cx="80" cy="20" r="12" fill="url(#diagonalGradient)" />
</svg>
